name: Build Quick Bubble APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out modification package
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Fetch matching PlayTranslate source
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/dominostars/playtranslate.git
          git -C upstream fetch --depth 1 origin 23248d8db762d9a7ea75e8f68f533f27c98df20e
          git -C upstream checkout FETCH_HEAD
          git -C upstream submodule update --init --recursive --depth 1

      - name: Apply Quick Bubble modification
        run: python3 apply_mod.py upstream

      - name: Build debug APK
        working-directory: upstream
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayTranslate-QuickBubble-debug-apk
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish direct-download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp upstream/app/build/outputs/apk/debug/app-debug.apk PlayTranslate-SteelBlue-v2.4.1-debug.apk
          if gh release view steel-blue-v2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload steel-blue-v2 PlayTranslate-SteelBlue-v2.4.1-debug.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create steel-blue-v2 PlayTranslate-SteelBlue-v2.4.1-debug.apk \
              --title "PlayTranslate Steel Blue v2" \
              --notes "深色钢蓝主题、整页稳定实时翻译、拖动识别提速、截图与通知隐私修复、背景/头像/悬浮球个性化。" \
              --latest --repo "$GITHUB_REPOSITORY"
          fi

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '自动构建失败，下面是末尾日志：'
            echo '```'
            tail -n 220 build.log 2>/dev/null || echo 'build.log unavailable'
            echo '```'
          } > failure.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Build failed: ${GITHUB_SHA::8}" --body-file failure.md
