name: Build Quick Bubble APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out modification package
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Fetch matching PlayTranslate source
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/dominostars/playtranslate.git
          git -C upstream fetch --depth 1 origin 23248d8db762d9a7ea75e8f68f533f27c98df20e
          git -C upstream checkout FETCH_HEAD
          git -C upstream submodule update --init --recursive --depth 1

      - name: Apply Quick Bubble modification
        run: python3 apply_mod.py upstream

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayTranslate-QuickBubble-debug-apk
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
